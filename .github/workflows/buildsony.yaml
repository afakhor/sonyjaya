name: SONY JAYA - Auto Build HPP

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.29.3'

      - name: Install Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 libsqlite3-dev clang cmake ninja-build pkg-config
          flutter pub get

      - name: Generate Otak HPP (Drift + Riverpod + Isar)
        run: |
          dart run build_runner build --delete-conflicting-outputs

      - name: Matangkan - Unit Test FIFO/AVERAGE LOG
        run: |
          ls test/
          flutter test test/fifo_average_log_test.dart --verbose

      - name: Build APK Debug SONY JAYA
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sony-jaya-apk
          path: build/app/outputs/flutter-apk/app-debug.apk