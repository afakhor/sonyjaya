name: sony_jaya
description: SONY JAYA - IPOS 5 Auto-Control HPP
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"      # <- naik, karena source_gen 2.0.0 butuh Dart 3.6
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  # Otak multifungsi
  drift: ^2.26.1             # <- naik biar sama-sama source_gen 2.x
  sqlite3_flutter_libs: ^0.5.42
  drift_flutter: ^0.2.7
  
  # Saraf super Reaktif
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
