name: Build APK Debug

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'master'
          cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 libsqlite3-dev clang cmake ninja-build pkg-config

      - name: Fix Gradle download - bypass GitHub block
        run: |
          rm -f /tmp/gradle-8.13.0-bin.zip
          echo "Downloading Gradle 8.13.0 with Browser UA..."
          curl -A "Mozilla/5.0" -L --retry 5 --retry-delay 3 -o /tmp/gradle-8.13.0-bin.zip https://services.gradle.org/distributions/gradle-8.13.0-bin.zip
          ls -lh /tmp/gradle-8.13.0-bin.zip
          
          # Validasi zip, kalau corrupt coba mirror Tencent
          if ! unzip -t /tmp/gradle-8.13.0-bin.zip > /dev/null 2>&1; then
            echo "First download corrupt, trying Tencent mirror..."
            rm -f /tmp/gradle-8.13.0-bin.zip
            curl -A "Mozilla/5.0" -L --retry 5 -o /tmp/gradle-8.13.0-bin.zip https://mirrors.cloud.tencent.com/gradle/gradle-8.13.0-bin.zip
            ls -lh /tmp/gradle-8.13.0-bin.zip
            unzip -t /tmp/gradle-8.13.0-bin.zip
          fi

          # Overwrite wrapper properties pakai file:// lokal
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=file\:///tmp/gradle-8.13.0-bin.zip
          EOF
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Clean
        run: |
          rm -f pubspec.lock
          flutter clean

      - name: Pub get
        run: flutter pub get

      - name: Build APK Debug
        run: flutter build apk --debug -v --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk