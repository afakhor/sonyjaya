name: Build APK Debug
on:
  push:
    branches: [ main, master ]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle 8.13.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13.0
      - name: Setup Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'master'
          cache: true
      - name: Install Linux deps
        run: sudo apt-get update && sudo apt-get install -y sqlite3 libsqlite3-dev clang cmake ninja-build pkg-config
      - name: Force wrapper 8.13.0
        run: |
          cd android && ./gradlew --version
      - name: Clean
        run: flutter clean
      - name: Pub get
        run: flutter pub get
      - name: Build APK Debug
        run: flutter build apk --debug --android-skip-build-dependency-validation
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
