name: Build APK Debug
on:
  push:
    branches: [ main, master ]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'master'
          cache: true

      - name: Install Linux deps
        run: sudo apt-get update && sudo apt-get install -y sqlite3 libsqlite3-dev clang cmake ninja-build pkg-config

      - name: Download Gradle from GitHub Releases
        run: |
          curl -L --retry 5 -o /tmp/gradle-8.10.2-bin.zip https://github.com/gradle/gradle/releases/download/v8.10.2/gradle-8.10.2-bin.zip
          ls -lh /tmp/gradle-8.10.2-bin.zip
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'WRAP'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=file\:///tmp/gradle-8.10.2-bin.zip
          WRAP
          cat android/gradle/wrapper/gradle-wrapper.properties
          ls -lh android/ | grep gradlew || echo "gradlew missing"

      - name: Fix gradlew if missing
        run: |
          if [ ! -f android/gradlew ]; then
            echo "gradlew hilang, regenerate android folder"
            flutter create --platforms=android .
          fi
          chmod +x android/gradlew
          ls -lh android/gradlew

      - name: Build APK Debug
        run: |
          flutter clean
          flutter pub get
          flutter build apk --debug --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
