      git:
        url: https://github.com/MaxRoversTech/flutter_workmanager.git
        ref: fix/android-embedding-v2
  
  # Cache Cepat
  isar_community: ^3.3.0-dev.1
  isar_community_flutter_libs: ^3.3.0-dev.1

  # Utils Toko Bangunan
  path_provider: ^2.1.2
  path: ^1.9.0     # <- turun, karena flutter_test 3.29 ngunci 1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.26.1
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5
  isar_community_generator: ^3.3.0-dev.1
  flutter_lints: ^3.0.2
