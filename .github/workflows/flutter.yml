name: Build APK Debug
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'master'
          cache: true

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y sqlite3 libsqlite3-dev clang cmake ninja-build pkg-config

      - name: Download Gradle 8.13.0 from GitHub Releases (bypass WAF)
        run: |
          curl -L --retry 5 -o /tmp/gradle-8.13.0-bin.zip https://github.com/gradle/gradle/releases/download/v8.13.0/gradle-8.13.0-bin.zip
          ls -lh /tmp/gradle-8.13.0-bin.zip
          du -h /tmp/gradle-8.13.0-bin.zip
          unzip -t /tmp/gradle-8.13.0-bin.zip | tail -3
          # harus 133M dan OK

      - name: Ensure gradlew exists
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create --platforms=android .
          fi
          chmod +x android/gradlew
          ls -lh android/gradlew

      - name: Force wrapper to use local zip - AFTER flutter create
        run: |
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=file\:///tmp/gradle-8.13.0-bin.zip
          EOF
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Build APK Debug
        run: |
          flutter clean
          flutter pub get
          # overwrite lagi setelah pub get, karena pub get kadang upgrade wrapper
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=file\:///tmp/gradle-8.13.0-bin.zip
          EOF
          flutter build apk --debug --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk