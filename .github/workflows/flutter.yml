name: Build APK Debug
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.10.2 dari cache - anti 9 byte
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
          cache-disabled: false

      - name: Setup Flutter master 3.47.5 - Dart 3.10
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'master'
          cache: true

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y sqlite3 libsqlite3-dev clang cmake ninja-build pkg-config

      - name: Paksa pakai Gradle 8.10.2 biar gak download 8.13.0 9 byte
        run: |
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          EOF
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Build APK langsung GitHub
        run: |
          flutter --version
          dart --version
          flutter clean
          flutter pub get
          flutter build apk --debug --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk