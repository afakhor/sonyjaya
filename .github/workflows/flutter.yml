name: Build APK Debug
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter master 3.47.5 Dart 3.10
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'master'
          cache: true

      - name: Install Gradle 8.13.0 dari GitHub Releases
        run: |
          cd /tmp
          rm -f gradle.zip
          curl -L -A "Mozilla/5.0" -o gradle.zip https://github.com/gradle/gradle/releases/download/v8.13.0/gradle-8.13.0-bin.zip
          ls -lh gradle.zip
          # harus 130M+, bukan 9
          unzip -q gradle.zip -d /opt
          /opt/gradle-8.13.0/bin/gradle --version
          echo "/opt/gradle-8.13.0/bin" >> $GITHUB_PATH

      - name: Bypass gradlew wrapper - pakai gradle sistem
        run: |
          cat > android/gradlew << 'SH'
          #!/usr/bin/env sh
          exec /opt/gradle-8.13.0/bin/gradle "$@"
          SH
          chmod +x android/gradlew
          cat android/gradlew

      - name: Build APK
        run: |
          flutter --version
          flutter clean
          flutter pub get
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk