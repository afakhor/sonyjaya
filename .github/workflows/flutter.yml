name: Build APK Debug
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.10.2 cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Setup Flutter 3.47.5 master Dart 3.10
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'master'
          cache: true

      - name: Patch AGP turun ke 8.7.3 biar cocok Gradle 8.10.2
        run: |
          flutter pub get
          # Flutter 3.47.5 upgrade build.gradle.kts ke AGP 8.11 -> kita turunin lagi
          sed -i 's/id("com.android.application") version ".*"/id("com.android.application") version "8.7.3" apply false/' android/settings.gradle.kts || true
          sed -i 's/id("com.android.library") version ".*"/id("com.android.library") version "8.7.3" apply false/' android/settings.gradle.kts || true
          sed -i 's/8\.11\./8.7.3/g' android/settings.gradle.kts || true
          sed -i 's/8\.13/8.10.2/g' android/gradle/wrapper/gradle-wrapper.properties || true
          cat android/settings.gradle.kts
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Build APK
        run: |
          flutter clean
          flutter pub get
          flutter build apk --debug --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk