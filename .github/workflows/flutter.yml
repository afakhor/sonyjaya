name: Build APK Debug
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter master 3.47.5 - Dart 3.10
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'master'
          cache: true

      - name: Download Gradle 8.13.0 dari GitHub Release - anti 9 byte
        run: |
          GRADLE_VERSION=8.13.0
          HASH=3u0wlv7sqf0pmdwvfx6uasd4k
          DEST="$HOME/.gradle/wrapper/dists/gradle-${GRADLE_VERSION}-bin/$HASH"
          mkdir -p "$DEST"
          echo "Downloading gradle..."
          # coba 3 mirror, yang tembus di GitHub Actions
          curl -L -A "Mozilla/5.0" -o /tmp/gradle.zip https://github.com/gradle/gradle/releases/download/v${GRADLE_VERSION}/gradle-${GRADLE_VERSION}-bin.zip || true
          ls -lh /tmp/gradle.zip
          if [ $(stat -c%s /tmp/gradle.zip) -lt 1000000 ]; then
            echo "GitHub release fail, coba ghproxy..."
            curl -L -A "Mozilla/5.0" -o /tmp/gradle.zip https://ghproxy.com/https://github.com/gradle/gradle/releases/download/v${GRADLE_VERSION}/gradle-${GRADLE_VERSION}-bin.zip || true
            ls -lh /tmp/gradle.zip
          fi
          if [ $(stat -c%s /tmp/gradle.zip) -lt 1000000 ]; then
            echo "ghproxy fail, coba services..."
            curl -L -A "Mozilla/5.0" -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip || true
            ls -lh /tmp/gradle.zip
          fi
          echo "Size:"
          ls -lh /tmp/gradle.zip
          cp /tmp/gradle.zip "$DEST/gradle-${GRADLE_VERSION}-bin.zip"
          ls -lh "$DEST/"

      - name: Fix wrapper ke 8.13.0
        run: |
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.13.0-bin.zip
          EOF
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Build APK
        run: |
          flutter --version
          flutter clean
          flutter pub get
          flutter build apk --debug --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk