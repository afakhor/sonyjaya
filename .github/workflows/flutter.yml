name: Build APK Debug
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.10.2 cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Setup Flutter 3.47.5 master
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'master'
          cache: true

      - name: Build APK - patch AGP setelah pub get
        run: |
          flutter clean
          flutter pub get
          
          # Jalankan build_runner tanpa opsi --delete-conflicting-outputs
          flutter pub run build_runner build

          echo "=== BEFORE PATCH ==="
          cat android/settings.gradle.kts | grep -i "android"
          cat android/gradle/wrapper/gradle-wrapper.properties

          # Turunin AGP 8.11.x -> 8.7.3 biar cocok Gradle 8.10.2
          sed -i 's/version "8\.[0-9]*\.[0-9]*"/version "8.7.3"/g' android/settings.gradle.kts
          # Fix gradle wrapper: 8.13.0 -> 8.10.2 (bukan 8.10.2.0)
          sed -i 's/8\.13\.0/8.10.2/g' android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's/8\.13/8.10.2/g' android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's/8\.10\.2\.0/8.10.2/g' android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's|downloads.gradle.org|services.gradle.org|g' android/gradle/wrapper/gradle-wrapper.properties

          echo "=== AFTER PATCH ==="
          cat android/settings.gradle.kts | grep -i "android"
          cat android/gradle/wrapper/gradle-wrapper.properties

          flutter build apk --debug --android-skip-build-dependency-validation


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
