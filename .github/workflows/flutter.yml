name: Build APK Debug
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Setup Flutter master (buat workmanager 0.10.10)
        uses: subosito/flutter-action@v2
        with:
          channel: 'master'
          cache: true
      - name: Patch AGP
        run: |
          sed -i 's/version "8[^"]*"/version "8.7.3"/g' android/settings.gradle.kts
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.10.2-all.zip" > android/gradle/wrapper/gradle-wrapper.properties
      - name: Build APK pakai build_runner build
        run: |
          flutter --version
          flutter pub get
          # INI YANG BARU, bukan --delete-conflicting-outputs
          dart run build_runner build -d
          flutter build apk --debug --android-skip-build-dependency-validation
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk